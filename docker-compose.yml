services:
  dollar-api:
    build: ./apps/api
    environment:
      DATABASE_URL: file:/data/dev.db
      JWT_SECRET: change-me
      PORT: 4000
    ports:
      - "4000:4000"
    volumes:
      - dollar-data:/data
  dollar-web:
    build: ./apps/web
    ports:
      - "5173:80"
    depends_on:
      - dollar-api
volumes:
  dollar-data:
