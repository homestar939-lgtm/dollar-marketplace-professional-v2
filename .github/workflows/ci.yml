name: Dollar Marketplace CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  web-api:
    name: Web + API verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts
      - name: Source verification
        run: node scripts/verify-source.mjs
      - name: Prisma client generation
        run: npm run db:generate
      - name: Prisma schema validation
        run: npx prisma validate --schema apps/api/prisma/schema.prisma
      - name: JavaScript syntax validation
        shell: bash
        run: |
          set -euo pipefail
          find apps/api/src apps/api/prisma -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Web production build
        run: npm run build -w apps/web

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37 build-tools;36.0.0'
      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6'
          cache-provider: basic
      - name: Build debug APK
        working-directory: apps/android
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dollar-marketplace-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
