name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API — schema, migrations, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dollar
          POSTGRES_PASSWORD: dollar
          POSTGRES_DB: dollar
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://dollar:dollar@localhost:5432/dollar?schema=public
      JWT_SECRET: ci-secret-value-that-is-long-enough
      EXPOSE_TOKENS: "true"
      BCRYPT_ROUNDS: "4"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build web application
        run: npm run build -w apps/web
      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate
      - name: Validate schema
        working-directory: apps/api
        run: npx prisma validate
      - name: Apply migrations
        working-directory: apps/api
        run: npx prisma migrate deploy
      - name: Seed demo data
        working-directory: apps/api
        run: node prisma/seed.js
      - name: Run end-to-end tests
        run: npm test -w apps/api
