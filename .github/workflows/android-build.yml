name: android-build

on:
  push:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'apps/android/**'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Locate Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK" ]; then SDK="$HOME/android-sdk"; fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
      - name: Install SDK packages (best effort)
        continue-on-error: true
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)
          if [ -z "$SDKM" ]; then exit 0; fi
          printf 'y\n%.0s' {1..30} | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "build-tools;37.0.0" "platforms;android-37.0" || \
          "$SDKM" --install "platform-tools" "build-tools;37.0.0" "platforms;android-37" || true
      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dollar-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  build-release:
    name: assembleRelease (LAN)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.ref == 'refs/heads/feature/lan-username-auth'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      LAN_API_BASE_URL: ${{ vars.LAN_API_BASE_URL || 'http://192.168.1.50:4000/api' }}
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Locate Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK" ]; then SDK="$HOME/android-sdk"; fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
      - name: Install Android platform for Release
        continue-on-error: true
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)
          if [ -z "$SDKM" ]; then exit 0; fi
          printf 'y\n%.0s' {1..30} | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "build-tools;37.0.0" "platforms;android-37.0" || \
          "$SDKM" --install "platform-tools" "build-tools;37.0.0" "platforms;android-37" || true
      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Generate temporary release keystore
        run: |
          STORE_PASSWORD="$(openssl rand -hex 32)"
          echo "RELEASE_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=dollar-lan-temporary" >> "$GITHUB_ENV"
          keytool -genkeypair -noprompt -v \
            -keystore "$RUNNER_TEMP/dollar-lan-release.jks" \
            -storepass "$STORE_PASSWORD" -keypass "$STORE_PASSWORD" \
            -alias dollar-lan-temporary -keyalg RSA -keysize 3072 -validity 3650 \
            -dname "CN=Dollar Marketplace LAN, OU=Internal, O=Dollar" \
            -ext "KeyUsage=digitalSignature" -ext "ExtendedKeyUsage=codeSigning"
          chmod 600 "$RUNNER_TEMP/dollar-lan-release.jks"
      - name: Build signed LAN release APK
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace \
            -PAPI_BASE_URL="$LAN_API_BASE_URL" \
            -PRELEASE_STORE_FILE="$RUNNER_TEMP/dollar-lan-release.jks" \
            -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: dollar-lan-release-apk
          path: apps/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-build-reports
          path: |
            apps/android/app/build/reports/**
            apps/android/build/reports/**
          retention-days: 7
