name: android-build

# المصنع السحابي: يبني APK لتطبيق دولار B2B على GitHub مباشرة،
# فلا حاجة لتثبيت Android SDK على أي جهاز محلي.
on:
  push:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'apps/android/**'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages (best effort)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "build-tools;37.0.0" "platforms;android-37" \
            || sdkmanager "platform-tools" "build-tools;37.0.0" "platforms;android-37.0" \
            || true

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Gradle version
        run: gradle --version

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace -PAPI_BASE_URL=${{ vars.DOLLAR_API_BASE_URL || 'http://10.0.2.2:4000/api' }} -PGOOGLE_WEB_CLIENT_ID=${{ vars.GOOGLE_WEB_CLIENT_ID || '' }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dollar-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports
          path: |
            apps/android/app/build/reports/**
            apps/android/build/reports/**
          retention-days: 7
